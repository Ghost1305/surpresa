<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%23d0315a'/%3E%3Crect x='2' y='3' width='1' height='2' fill='%23fff1d6'/%3E%3Crect x='5' y='3' width='1' height='2' fill='%23fff1d6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Silkscreen:wght@700&display=swap" media="print" onload="this.media='all'">
<style>
/* Cartão dobrado na horizontal, com a dobra no meio da tela: a aba sobe e o morcego sai da dobra, por cima de tudo. */
:root {
  --noite: #150c22;
  --ameixa: #2a1538;
  --vinho: #4a1c4b;
  --cereja: #d0315a;
  --cereja-funda: #7d1638;
  --rosa: #ff9fb3;
  --creme: #fff1d6;
  --titulo: "Pixelify Sans", "Courier New", monospace;
  --rotulo: "Silkscreen", "Courier New", monospace;
  --u: 3px;
  --l: 340px;
  --a: 280px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--noite);
  color: var(--creme);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}
canvas {
  display: block;
  image-rendering: crisp-edges;
  image-rendering: pixelated;
}
#palco {
  position: fixed;
  inset: 0;
  perspective: 1400px;
  perspective-origin: 50% 50%;
}
#ceu, #voo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
#voo { z-index: 5; pointer-events: none; }
#cartao, #balanca, #aba { transform-style: preserve-3d; }
#cartao {
  position: absolute;
  width: var(--l);
  height: var(--a);
  transform: translateY(calc(var(--a) / -2));
}
#balanca {
  position: absolute;
  inset: 0;
  animation: treme 3.4s steps(1) infinite;
}
.aberto #balanca { animation: none; }
@keyframes treme {
  0%, 82%, 94%, 100% { transform: none; }
  84% { transform: rotate(-1.2deg); }
  86% { transform: rotate(1.2deg); }
  88% { transform: rotate(-1deg); }
  90% { transform: rotate(1deg); }
  92% { transform: rotate(-.5deg); }
}
.pagina, .face {
  position: absolute;
  inset: 0;
  box-shadow: 0 0 0 var(--u) #5b3470;
}
.pagina canvas, .face canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
#aba {
  position: absolute;
  inset: 0;
  transform-origin: 50% 0;
  transform: translateZ(1px);
}
.face {
  overflow: hidden;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}
.verso { transform: rotateX(180deg); }
.veu, #sombra {
  position: absolute;
  inset: 0;
  background: #0a0512;
  opacity: 0;
  pointer-events: none;
}
#abrir {
  appearance: none;
  -webkit-appearance: none;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  width: 100%;
  border: 0;
  border-radius: 0;
  padding: calc(var(--u) * 7);
  background: var(--cereja);
  color: var(--creme);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
#abrir:focus-visible .botao { outline: var(--u) solid var(--creme); outline-offset: var(--u); }
.pergunta {
  position: relative;
  font-family: var(--titulo);
  font-weight: 700;
  font-size: min(calc(var(--l) * .145), calc(var(--a) * .19));
  line-height: 1;
  text-shadow: 0 var(--u) 0 var(--cereja-funda);
}
.botao {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: calc(var(--u) * 2);
  padding: calc(var(--u) * 2) calc(var(--u) * 4);
  background: var(--creme);
  color: var(--noite);
  font-family: var(--rotulo);
  font-weight: 700;
  font-size: min(calc(var(--l) * .056), calc(var(--a) * .075));
  letter-spacing: .02em;
  line-height: 1.2;
  white-space: nowrap;
  box-shadow: var(--u) var(--u) 0 var(--cereja-funda);
}
#abrir:active .botao {
  transform: translate(var(--u), var(--u));
  box-shadow: none;
}
.seta {
  width: calc(var(--u) * 3);
  height: calc(var(--u) * 5);
  background: var(--cereja);
  clip-path: polygon(0 0, 33.3% 0, 33.3% 20%, 66.6% 20%, 66.6% 40%, 100% 40%, 100% 60%, 66.6% 60%, 66.6% 80%, 33.3% 80%, 33.3% 100%, 0 100%);
  animation: pisca .9s steps(1) infinite;
}
@keyframes pisca { 50% { opacity: 0; } }
#mensagem {
  position: absolute;
  top: calc(var(--u) * 5);
  left: calc(var(--u) * 5);
  right: calc(var(--u) * 5);
  margin: 0;
  outline: none;
  font-family: var(--titulo);
  font-weight: 700;
  font-size: var(--fs, 58px);
  line-height: 1;
  white-space: nowrap;
}
#mensagem span { display: inline-block; }
#boa {
  font-size: .8em;
  color: var(--creme);
  text-shadow: 0 var(--u) 0 var(--noite);
}
#vamp {
  color: var(--rosa);
  text-shadow: 0 var(--u) 0 var(--cereja-funda);
}
#mensagem .palavra { display: block; width: max-content; }
.aberto .letra {
  animation: salta .42s steps(6, end) both;
  animation-delay: calc(var(--i) * 55ms + 950ms);
}
@keyframes salta {
  0% { transform: translateY(calc(var(--u) * 8)) scaleY(0); opacity: 0; }
  55% { transform: translateY(calc(var(--u) * -3)) scaleY(1.15); opacity: 1; }
  100% { transform: none; opacity: 1; }
}
#morcego {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 6;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
}
#morcego:focus-visible { outline: var(--u) dashed var(--creme); }
@media (prefers-reduced-motion: reduce) {
  #balanca, .seta, .aberto .letra { animation: none; }
}
</style>
</head>
<body>
<main id="palco">
  <canvas id="ceu" aria-hidden="true"></canvas>
  <div id="cartao">
    <div id="balanca">
      <div class="pagina">
        <canvas id="telaBaixo" aria-hidden="true"></canvas>
        <h1 id="mensagem" tabindex="-1" aria-label="Boa Noite vampirinha">
          <span id="boa" class="palavra" aria-hidden="true">Boa Noite</span>
          <span id="vamp" class="palavra" aria-hidden="true">vampirinha</span>
        </h1>
        <div id="sombra"></div>
      </div>
      <div id="aba">
        <button id="abrir" class="face" type="button">
          <canvas id="telaCapa" aria-hidden="true"></canvas>
          <span class="pergunta">Quer uma<br>surpresa?</span>
          <span class="botao"><span class="seta"></span>Clique aqui</span>
          <span class="veu"></span>
        </button>
        <div class="face verso">
          <canvas id="telaCima" aria-hidden="true"></canvas>
          <div class="veu"></div>
        </div>
      </div>
    </div>
  </div>
  <canvas id="voo" aria-hidden="true"></canvas>
  <button id="morcego" type="button" aria-label="Fazer carinho no morcego" hidden></button>
</main>
<noscript><p>Boa Noite vampirinha</p></noscript>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const reduzido = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const raiz = document.documentElement;
  const cartao = $('cartao'), balanca = $('balanca'), aba = $('aba'), voo = $('voo'), botaoMorcego = $('morcego');
  const veus = document.querySelectorAll('.veu');

  // ---------- pixels ----------
  const COR = {
    o: '#1a0f2b', b: '#7c58c4', l: '#a88be0', f: '#ffdfe4', p: '#ff8fa8',
    c: '#d0315a', C: '#8f1d42', w: '#ffffff', m: '#54358c', n: '#9278d6'
  };
  const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
  const novaTela = (l, a) => { const c = document.createElement('canvas'); c.width = l; c.height = a; return c; };
  const ponto = (g, cor, x, y, l = 1, a = 1) => { g.fillStyle = cor; g.fillRect(x, y, l, a); };
  const carimbo = (g, linhas, x0, y0) => linhas.forEach((linha, y) =>
    [...linha].forEach((ch, x) => { if (ch !== '.') ponto(g, COR[ch], x0 + x, y0 + y); }));
  const sorteio = semente => () => (semente = semente * 16807 % 2147483647) / 2147483647;

  function degrade(g, l, y0, y1, cores) {
    for (let y = y0; y < y1; y++) {
      const t = (y - y0) / Math.max(1, y1 - y0 - 1) * (cores.length - 1), i = Math.floor(t), f = t - i;
      for (let x = 0; x < l; x++) {
        const c = f > (BAYER[y & 3][x & 3] + .5) / 16 ? cores[Math.min(i + 1, cores.length - 1)] : cores[i];
        ponto(g, c, x, y);
      }
    }
  }

  // ---------- o morcego ----------
  const SL = 50, SA = 40, NQ = 8, X0 = 16, Y0 = 3;
  const OMBRO = [20, 26];
  const METADE = [
    '.o.......',
    '.oo......',
    '.obo.....',
    '.opbo....',
    '.oppbo...',
    '.oppbo...',
    '.oppbbooo',
    '.oppbbbbb',
    '.obpbbbll',
    'oobbbbbbl',
    'obbbbfffb',
    'obbbffffb',
    'obbffffff',
    'obfffffff',
    'obfffffff',
    'obfffffff',
    'obfffffff',
    'obfffffff',
    'obppfffff',
    '.obpfffff',
    '.oobfffff',
    '..oobbbbb',
    '...oobbbb',
    '....obbbb',
    '....obbll',
    '....obbll',
    '....oobbl',
    '.....oooo',
    '.....obo.',
    '.....ooo.'
  ];
  const OLHOS = {
    aberto: ['.oo.', 'owwo', 'oooo', 'oopo', '.oo.'],
    piscando: ['....', '....', '....', 'oooo', '....'],
    feliz: ['....', '.oo.', 'o..o', '....', '....']
  };
  const POSE = {
    cima: [[-8, -12], [-20, -14], [-17, -4], [-9, 2], [0, 6]],
    meio: [[-11, -8], [-20, -2], [-14, 5], [-6, 7], [0, 6]],
    baixo: [[-11, -3], [-17, 10], [-10, 11], [-4, 10], [0, 6]]
  };
  const CORACAO = ['.pp.pp.', 'pwppppp', 'ppppppp', '.ppppp.', '..ppp..', '...p...'];

  function dentro(poli, x, y) {
    let d = false;
    for (let i = 0, j = poli.length - 1; i < poli.length; j = i++) {
      const [xi, yi] = poli[i], [xj, yj] = poli[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) d = !d;
    }
    return d;
  }
  function linha(p, q, cada) {
    const n = Math.max(Math.abs(q[0] - p[0]), Math.abs(q[1] - p[1]), 1);
    for (let i = 0; i <= n; i++) cada(Math.round(p[0] + (q[0] - p[0]) * i / n), Math.round(p[1] + (q[1] - p[1]) * i / n));
  }
  function mordida(p, q, punho) {
    const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2, dx = q[0] - p[0], dy = q[1] - p[1];
    const c = Math.hypot(dx, dy), s = Math.max(1.3, c * .24);
    let nx = -dy / c, ny = dx / c;
    if (nx * (mx - punho[0]) + ny * (my - punho[1]) < 0) { nx = -nx; ny = -ny; }
    const r = (c * c / 4 + s * s) / (2 * s), d = r - s;
    return [mx + nx * d, my + ny * d, r];
  }
  function quadroDeAsas(u) {
    const alvo = u >= 0 ? POSE.cima : POSE.baixo, k = Math.abs(u);
    const [W, F1, F2, F3, H] = POSE.meio.map((p, i) => [
      p[0] + (alvo[i][0] - p[0]) * k + OMBRO[0],
      p[1] + (alvo[i][1] - p[1]) * k + OMBRO[1]
    ]);
    const poli = [OMBRO, W, F1, F2, F3, H];
    const cortes = [[F1, F2], [F2, F3], [F3, H]].map(([p, q]) => mordida(p, q, W));
    const m = Array.from({ length: SA }, () => new Array(SL).fill(null));
    for (let y = 0; y < SA; y++) for (let x = 0; x < SL; x++) {
      const px = x + .5, py = y + .5;
      if (dentro(poli, px, py) && !cortes.some(([cx, cy, r]) => Math.hypot(px - cx, py - cy) < r)) m[y][x] = 'm';
    }
    const osso = (x, y) => { if (m[y] && m[y][x]) m[y][x] = 'n'; };
    linha(W, F2, osso);
    linha(W, F3, osso);
    linha([OMBRO[0], OMBRO[1] + 1], [W[0], W[1] + 1], (x, y) => { osso(x, y); osso(x, y + 1); });
    linha([W[0], W[1] + 1], [F1[0] + 1, F1[1] + 1], osso);
    const c = novaTela(SL, SA), g = c.getContext('2d');
    for (let y = 0; y < SA; y++) for (let x = 0; x < SL; x++) {
      if (!m[y][x]) continue;
      const borda = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => !(m[y + b] && m[y + b][x + a]));
      const cor = COR[borda ? 'o' : m[y][x]];
      ponto(g, cor, x, y);
      ponto(g, cor, SL - 1 - x, y);
    }
    return c;
  }

  const corpo = novaTela(SL, SA);
  {
    const g = corpo.getContext('2d');
    carimbo(g, METADE.map(l => l + [...l].reverse().join('')), X0, Y0);
    carimbo(g, ['cc.cc', 'ccCcc', 'cc.cc'], X0 + 4, Y0 + 7);
    [[8, 18], [9, 18]].forEach(([x, y]) => ponto(g, COR.p, X0 + x, Y0 + y));
    [[6, 19], [7, 20], [8, 19], [9, 19], [10, 20], [11, 19]].forEach(([x, y]) => ponto(g, COR.o, X0 + x, Y0 + y));
    [[7, 21], [7, 22], [10, 21], [10, 22]].forEach(([x, y]) => ponto(g, COR.w, X0 + x, Y0 + y));
  }
  const olhos = {};
  for (const tipo in OLHOS) {
    const c = olhos[tipo] = novaTela(SL, SA), g = c.getContext('2d');
    carimbo(g, OLHOS[tipo], X0 + 3, Y0 + 13);
    carimbo(g, OLHOS[tipo], X0 + 11, Y0 + 13);
  }
  const ondas = Array.from({ length: NQ }, (_, i) => Math.cos(2 * Math.PI * i / NQ));
  const asas = ondas.map(quadroDeAsas);
  const sombras = asas.map(a => {
    const c = novaTela(SL, SA), g = c.getContext('2d');
    g.drawImage(a, 0, 0);
    g.drawImage(corpo, 0, 0);
    g.globalCompositeOperation = 'source-in';
    ponto(g, '#2a1040', 0, 0, SL, SA);
    return c;
  });
  const coracao = novaTela(7, 6);
  carimbo(coracao.getContext('2d'), CORACAO, 0, 0);

  // ---------- medidas ----------
  let W, H, cx, fy, l, a, u, P, Pico, dpr, lb, ab;
  let estrelas = [], ceuBase, capaBase, olhoCapaAberto = true;

  function medir() {
    W = innerWidth;
    H = innerHeight;
    const margem = Math.max(12, H * .03);
    a = (H - 2 * margem) / 2;
    l = Math.min(W - 32, 560, a * 1.55);
    a = Math.min(a, l * .82);
    u = Math.max(2, Math.round(l / 110));
    l = Math.floor(l / u) * u;
    a = Math.floor(a / u) * u;
    lb = l / u;
    ab = a / u;
    P = Math.max(2, Math.floor(l * .8 / SL));
    Pico = Math.round(P * 1.5);
    cx = Math.round(W / 2);
    fy = Math.round(H / 2);
    dpr = Math.min(devicePixelRatio || 1, 2);
    raiz.style.setProperty('--u', u + 'px');
    raiz.style.setProperty('--l', l + 'px');
    raiz.style.setProperty('--a', a + 'px');
    cartao.style.left = (cx - l / 2) + 'px';
    cartao.style.top = fy + 'px';
    voo.width = W * dpr;
    voo.height = H * dpr;
    botaoMorcego.style.width = botaoMorcego.style.height = (P * 30) + 'px';
    pintarCeu();
    pintarCapa();
    pintarCima();
    pintarBaixo();
    ajustarTexto();
    if (estado !== 'fechado') posicionarAba(1);
  }
  function ajustarTexto() {
    const m = $('mensagem'), v = $('vamp');
    m.style.setProperty('--fs', '100px');
    const fs = Math.min(100 * (l - 10 * u) / Math.max(1, v.offsetWidth), a * .3);
    m.style.setProperty('--fs', fs + 'px');
  }

  // ---------- cenários ----------
  function pintarCeu() {
    const c = $('ceu'), bl = Math.ceil(W / u), ba = Math.ceil(H / u);
    c.width = bl;
    c.height = ba;
    ceuBase = novaTela(bl, ba);
    const g = ceuBase.getContext('2d'), mx = bl / 2, my = ba / 2, raio = Math.hypot(mx, my);
    for (let y = 0; y < ba; y++) for (let x = 0; x < bl; x++) {
      const t = 1 - Math.hypot(x - mx, y - my) / raio;
      ponto(g, t * t * 1.5 > (BAYER[y & 3][x & 3] + .5) / 16 ? '#2a1538' : '#150c22', x, y);
    }
    const r = sorteio(4242);
    estrelas = Array.from({ length: Math.round(bl * ba / 150) }, () => ({
      x: Math.floor(r() * bl), y: Math.floor(r() * ba), f: r() * 6.28, v: 1 + r() * 2.5,
      cor: r() < .75 ? '#fff1d6' : '#a88be0', fixa: r() < .35
    }));
    pintarEstrelas(0);
  }
  function pintarEstrelas(agora) {
    const g = $('ceu').getContext('2d');
    g.drawImage(ceuBase, 0, 0);
    for (const e of estrelas) {
      if (e.fixa || reduzido || Math.sin(agora / 1000 * e.v + e.f) > -.2) ponto(g, e.cor, e.x, e.y);
    }
  }
  function pintarCapa() {
    capaBase = novaTela(lb, ab);
    const g = capaBase.getContext('2d');
    degrade(g, lb, 0, ab, ['#d0315a', '#d0315a', '#b22650']);
    const r = sorteio(77);
    for (let i = 0; i < lb * ab / 110; i++) ponto(g, '#b22650', Math.floor(r() * lb), Math.floor(r() * ab));
    const m = 3, cor = '#fff1d6';
    ponto(g, cor, m + 2, m, lb - 2 * m - 4, 1);
    ponto(g, cor, m + 2, ab - m - 1, lb - 2 * m - 4, 1);
    ponto(g, cor, m, m + 2, 1, ab - 2 * m - 4);
    ponto(g, cor, lb - m - 1, m + 2, 1, ab - 2 * m - 4);
    [[m + 1, m + 1], [lb - m - 2, m + 1], [m + 1, ab - m - 2], [lb - m - 2, ab - m - 2]].forEach(([x, y]) => ponto(g, cor, x, y));
    const hx = Math.round(lb * .76), hy = Math.round(ab * .62), hr = Math.round(Math.min(lb, ab) * .17);
    for (let y = -hr; y <= hr; y++) for (let x = -hr; x <= hr; x++) {
      const d = Math.hypot(x, y);
      if (d <= hr) ponto(g, '#150c22', hx + x, hy + y);
      else if (d <= hr + 1) ponto(g, '#7d1638', hx + x, hy + y);
    }
    desenharCapa(true);
  }
  function desenharCapa(aberto) {
    olhoCapaAberto = aberto;
    const c = $('telaCapa');
    if (c.width !== lb || c.height !== ab) { c.width = lb; c.height = ab; }
    const g = c.getContext('2d');
    g.drawImage(capaBase, 0, 0);
    const hx = Math.round(lb * .76), hy = Math.round(ab * .62);
    [-6, 2].forEach(dx => {
      if (aberto) {
        ponto(g, COR.w, hx + dx + 1, hy - 3, 2, 1);
        ponto(g, COR.w, hx + dx, hy - 2, 4, 3);
        ponto(g, COR.w, hx + dx + 1, hy + 1, 2, 1);
        ponto(g, '#150c22', hx + dx + 1, hy - 1, 2, 2);
      } else {
        ponto(g, COR.w, hx + dx, hy, 4, 1);
      }
    });
  }
  function pintarCima() {
    const c = $('telaCima');
    c.width = lb;
    c.height = ab;
    const g = c.getContext('2d');
    degrade(g, lb, 0, ab, ['#150c22', '#2a1538', '#4a1c4b']);
    const r = sorteio(909);
    for (let i = 0; i < lb * ab / 120; i++) ponto(g, r() < .7 ? '#fff1d6' : '#a88be0', Math.floor(r() * lb), Math.floor(r() * ab * .85));
    const mx = Math.round(lb / 2), my = Math.round(ab * .5), R = Math.round(Math.min(lb * .4, ab * .42));
    for (let y = -R - 3; y <= R + 3; y++) for (let x = -R - 3; x <= R + 3; x++) {
      const d = Math.hypot(x, y);
      if (d > R && d <= R + 3) {
        if ((BAYER[(y + 400) & 3][(x + 400) & 3] + .5) / 16 < (R + 3 - d) / 5) ponto(g, '#8a5a7a', mx + x, my + y);
      } else if (d <= R) {
        const sombra = Math.hypot(x + R * .22, y + R * .22) / R;
        const cor = sombra > 1 + (BAYER[(y + 400) & 3][(x + 400) & 3] - 8) / 90 ? '#f3c98b' : '#ffe9b8';
        ponto(g, cor, mx + x, my + y);
      }
    }
    [[-.42, -.3, .17], [.3, .34, .2], [.34, -.46, .1], [-.2, .52, .09]].forEach(([dx, dy, dr]) => {
      const rr = R * dr;
      for (let y = -rr; y <= rr; y++) for (let x = -rr; x <= rr; x++) {
        if (Math.hypot(x, y) <= rr) ponto(g, '#f3c98b', Math.round(mx + dx * R + x), Math.round(my + dy * R + y));
      }
    });
    nuvem(g, Math.round(lb * .06), Math.round(ab * .8), Math.round(lb * .32));
    nuvem(g, Math.round(lb * .62), Math.round(ab * .68), Math.round(lb * .3));
    ponto(g, '#150c22', 0, ab - 1, lb, 1);
  }
  function nuvem(g, x, y, largura) {
    const cor = '#6b3a78';
    ponto(g, cor, x, y, largura, 3);
    ponto(g, cor, x + 3, y - 2, largura - 8, 2);
    ponto(g, cor, x + Math.round(largura * .3), y - 4, Math.round(largura * .32), 2);
    ponto(g, cor, x + 2, y + 3, largura - 4, 1);
  }
  function pintarBaixo() {
    const c = $('telaBaixo');
    c.width = lb;
    c.height = ab;
    const g = c.getContext('2d');
    const chao = Math.round(ab * .74);
    degrade(g, lb, 0, chao + 6, ['#4a1c4b', '#4a1c4b', '#6d2658', '#a33a6a']);
    const morro = (base, a1, f1, p1, a2, f2, p2, cor) => {
      const alturas = [];
      for (let x = 0; x < lb; x++) {
        const y = Math.round(base + a1 * Math.sin(x * f1 + p1) + a2 * Math.sin(x * f2 + p2));
        alturas.push(y);
        ponto(g, cor, x, y, 1, ab - y);
      }
      return alturas;
    };
    const longe = morro(chao + 3, 3, .06, 1.1, 1, .17, .4, '#2a1538');
    const cx0 = Math.round(lb * .62);
    castelo(g, cx0, longe[Math.min(lb - 1, cx0 + 11)] + 1);
    const perto = morro(chao + 10, 3, .08, 3.6, 1, .23, 2, '#150c22');
    const r = sorteio(31);
    for (let i = 0; i < lb / 7; i++) {
      const x = Math.floor(r() * lb), h = 3 + Math.floor(r() * 3), b = perto[x];
      for (let k = 0; k < h; k++) ponto(g, '#150c22', x - Math.floor(k / 2), b - h + k, Math.floor(k / 2) * 2 + 1, 1);
    }
    ponto(g, '#150c22', 0, 0, lb, 1);
  }
  function castelo(g, x, b) {
    const cor = '#150c22', janela = '#ffe9b8';
    ponto(g, cor, x, b - 9, 22, 10);
    for (let i = 0; i < 22; i += 3) ponto(g, cor, x + i, b - 11, 2, 2);
    ponto(g, cor, x + 8, b - 18, 7, 10);
    for (let i = 0; i < 7; i += 2) ponto(g, cor, x + 8 + i, b - 20, 1, 2);
    const torre = (tx, topo, largura) => {
      ponto(g, cor, tx, topo, largura, b - topo + 1);
      const meio = Math.floor(largura / 2);
      for (let k = 0; k <= meio + 2; k++) {
        const w = Math.max(1, largura + 2 - k * 2 + (k > meio ? 0 : 0));
        ponto(g, cor, tx + Math.floor((largura - w) / 2), topo - k, w, 1);
      }
    };
    torre(x - 2, b - 14, 5);
    torre(x + 19, b - 12, 5);
    ponto(g, janela, x, b - 11, 1, 2);
    ponto(g, janela, x + 11, b - 15, 1, 2);
    ponto(g, janela, x + 21, b - 8, 1, 2);
    ponto(g, janela, x + 6, b - 5, 1, 2);
  }

  // ---------- abrir ----------
  let estado = 'fechado', tClique = 0;
  const DUR_ABRE = 1.1, T_SAI = .46, DUR_SAI = .78, DUR_RAS = 2.7, DUR_PAIRA = 6.5;

  function dividirLetras() {
    let i = 0;
    for (const p of [$('boa'), $('vamp')]) {
      const t = p.textContent;
      p.textContent = '';
      for (const ch of t) {
        const s = document.createElement('span');
        s.className = 'letra';
        s.style.setProperty('--i', i++);
        s.textContent = ch === ' ' ? ' ' : ch;
        p.appendChild(s);
      }
    }
  }
  function abrir() {
    if (estado !== 'fechado') return;
    estado = 'aberto';
    tClique = performance.now();
    raiz.classList.add('aberto');
    $('abrir').tabIndex = -1;
    $('abrir').setAttribute('aria-hidden', 'true');
    botaoMorcego.hidden = false;
    $('mensagem').focus({ preventScroll: true });
    if (reduzido) posicionarAba(1);
  }
  const suave = x => x * x * (3 - 2 * x);
  function posicionarAba(p) {
    let ang;
    if (p >= 1) ang = 180;
    else if (p < .72) ang = 186 * suave(p / .72);
    else ang = 186 - 6 * suave((p - .72) / .28);
    cartao.style.transform = `translateY(${-a / 2 * (1 - suave(Math.min(1, p / .8)))}px)`;
    aba.style.transform = p >= 1 ? 'rotateX(180deg)' : `translateZ(1px) rotateX(${ang}deg)`;
    const luz = Math.abs(Math.sin(ang * Math.PI / 180)) * .5;
    veus.forEach(v => { v.style.opacity = luz; });
    $('sombra').style.opacity = p >= 1 ? 0 : (1 - suave(Math.min(1, ang / 120))) * .7;
    return ang;
  }

  // ---------- voo ----------
  let fase = 'sai', tFase = T_SAI, rota = null, q0 = .5, lado = 1;
  let quadroAsa = 0, xAnt = 0, olhar = 0, ult = 0, proxCeu = 0;
  let proxPisca = 2500, fimPisca = 0, fimFeliz = 0, fimPulo = 0, explodiu = false, abaPronta = false, proxPiscaCapa = 1800;
  const faiscas = [], coracoes = [];

  function curva(pts, t) {
    const n = pts.length - 1, f = Math.min(t * n, n - 1e-6), i = Math.floor(f), s = f - i;
    const A = pts[Math.max(i - 1, 0)], B = pts[i], C = pts[i + 1], D = pts[Math.min(i + 2, n)];
    const q = (p0, p1, p2, p3) => .5 * (2 * p1 + (p2 - p0) * s + (2 * p0 - 5 * p1 + 4 * p2 - p3) * s * s + (3 * p1 - p0 - 3 * p2 + p3) * s * s * s);
    return [q(A[0], B[0], C[0], D[0]), q(A[1], B[1], C[1], D[1])];
  }
  function iniciarRasante(x, y, s, primeiro) {
    fase = 'rasante';
    tFase = s;
    q0 = primeiro ? .5 : 0;
    lado = -lado;
    const pt = (dx, dy) => [cx + lado * dx * l, fy + dy * a];
    rota = [[x, y], pt(.42, -.95), pt(.6, -.32), pt(0, .02), pt(-.6, -.32), pt(-.36, -.95), [cx, fy - a * .56]];
  }
  function posicao(s) {
    const py = fy - a * .56;
    if (reduzido) return { x: cx, y: py, n: P };
    if (fase === 'sai') {
      const q = Math.min(1, (s - tFase) / DUR_SAI), e = 1 - (1 - q) ** 3;
      const m = { x: cx, y: fy - a * .84 * e, n: Math.max(1, Math.round(1 + (Pico - 1) * e)) };
      if (q === 1) iniciarRasante(m.x, m.y, s, true);
      return m;
    }
    if (fase === 'rasante') {
      const q = Math.min(1, (s - tFase) / DUR_RAS), [x, y] = curva(rota, suave(q));
      const n = Math.round(P + (Pico - P) * Math.sin(Math.PI * (q0 + (1 - q0) * q)));
      if (q === 1) { fase = 'paira'; tFase = s; }
      return { x, y, n };
    }
    const t = s - tFase, r = Math.min(1, t / 1.4);
    const m = { x: cx + l * .13 * Math.sin(.95 * t) * r, y: py + a * .1 * Math.sin(1.9 * t) * r, n: P };
    if (t > DUR_PAIRA) iniciarRasante(m.x, m.y, s, false);
    return m;
  }
  function explodir() {
    const r = Math.random, cores = ['#fff1d6', '#ff9fb3', '#ffe9b8', '#a88be0', '#d0315a'];
    for (let i = 0; i < 34; i++) {
      const ang = -Math.PI * r(), v = 140 + r() * 460;
      faiscas.push({
        x: cx + (r() - .5) * l * .4, y: fy, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v,
        t: 0, vida: .55 + r() * .8, cor: cores[Math.floor(r() * cores.length)], tam: u * (1 + Math.floor(r() * 2))
      });
    }
  }
  function carinho() {
    if (estado === 'fechado') return;
    const agora = performance.now();
    fimFeliz = agora + 1500;
    fimPulo = agora + 340;
    for (let i = 0; i < 6; i++) {
      coracoes.push({
        dx: (i - 2.5) * P * 6, dy: -P * (14 + (i % 2) * 6), sobe: 0,
        atraso: reduzido ? 0 : i * .09, t: 0, vida: 1.3, f: Math.random() * 6
      });
    }
  }

  function quadro(agora) {
    const dt = Math.min(.05, (agora - ult) / 1000);
    ult = agora;
    if (agora >= proxCeu && !reduzido) { pintarEstrelas(agora); proxCeu = agora + 170; }
    if (estado === 'fechado') {
      if (agora >= proxPiscaCapa) {
        desenharCapa(!olhoCapaAberto);
        proxPiscaCapa = agora + (olhoCapaAberto ? 1400 + Math.random() * 2600 : 130);
      }
    } else {
      desenharVoo((agora - tClique) / 1000, dt, agora);
    }
    requestAnimationFrame(quadro);
  }

  function desenharVoo(s, dt, agora) {
    const v = voo.getContext('2d');
    v.setTransform(dpr, 0, 0, dpr, 0, 0);
    v.imageSmoothingEnabled = false;
    v.clearRect(0, 0, W, H);

    let ang = 180;
    if (!reduzido && !abaPronta) {
      const p = Math.min(1, s / DUR_ABRE);
      ang = posicionarAba(p);
      if (p >= 1) abaPronta = true;
    }
    if (reduzido) abaPronta = true;
    if (s < T_SAI && !reduzido) return;
    if (!explodiu) {
      explodiu = true;
      if (!reduzido) explodir();
    }
    balanca.style.transform = !reduzido && s - T_SAI < .24 && Math.floor((s - T_SAI) * 30) % 2 ? `translateY(${u}px)` : '';

    const m = posicao(s), n = m.n;
    if (!reduzido) quadroAsa += dt * (fase === 'paira' ? 15 : 24);
    const i = reduzido ? 1 : Math.floor(quadroAsa) % NQ;
    const onda = ondas[i];
    const vx = (m.x - xAnt) / Math.max(dt, .001);
    xAnt = m.x;
    olhar = reduzido ? 0 : Math.abs(vx) > l * .35 ? Math.sign(vx) : 0;
    if (agora >= proxPisca) { fimPisca = agora + 120; proxPisca = agora + 1800 + Math.random() * 3200; }
    const tipo = agora < fimFeliz ? 'feliz' : !reduzido && agora < fimPisca ? 'piscando' : 'aberto';
    const pulo = !reduzido && agora < fimPulo ? Math.sin((fimPulo - agora) / 340 * Math.PI) * n * 5 : 0;
    const bx = Math.round((m.x - SL * n / 2) / n) * n;
    const by = Math.round((m.y - SA * n / 2 - pulo + (onda > .4 ? n : 0)) / n) * n;
    const corpoY = onda > .4 ? n : onda < -.4 ? -n : 0;

    // sombra só existe onde há cartão embaixo: é ela que descola o morcego da página
    const topo = fy - a * Math.max(0, -Math.cos(ang * Math.PI / 180));
    const k = n / P;
    v.save();
    v.beginPath();
    v.rect(cx - l / 2, topo, l, fy + a - topo);
    v.clip();
    v.globalAlpha = .3;
    v.drawImage(sombras[i], bx + Math.round(3 * k) * n, by + Math.round(6 * k) * n, SL * n, SA * n);
    v.restore();

    v.drawImage(asas[i], bx, by, SL * n, SA * n);
    v.drawImage(corpo, bx, by + corpoY, SL * n, SA * n);
    v.drawImage(olhos[tipo], bx + olhar * n, by + corpoY, SL * n, SA * n);

    botaoMorcego.style.transform = `translate(${m.x - P * 15}px, ${m.y - P * 15}px)`;

    for (let j = faiscas.length - 1; j >= 0; j--) {
      const f = faiscas[j];
      f.t += dt;
      if (f.t > f.vida) { faiscas.splice(j, 1); continue; }
      f.vy += 620 * dt;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      if (f.t > f.vida * .7 && Math.floor(f.t * 22) % 2) continue;
      ponto(v, f.cor, Math.round(f.x / f.tam) * f.tam, Math.round(f.y / f.tam) * f.tam, f.tam, f.tam);
    }
    const nc = Math.max(2, P - 1);
    for (let j = coracoes.length - 1; j >= 0; j--) {
      const c = coracoes[j];
      c.t += dt;
      if (c.t > c.vida + c.atraso) { coracoes.splice(j, 1); continue; }
      if (c.t < c.atraso) continue;
      const vivo = c.t - c.atraso;
      const sobe = reduzido ? 0 : vivo * 95;
      const balanco = reduzido ? 0 : Math.sin(vivo * 5 + c.f) * nc * 2;
      if (vivo > c.vida * .75 && Math.floor(vivo * 18) % 2 && !reduzido) continue;
      const hx = Math.round((m.x + c.dx + balanco) / nc) * nc, hy = Math.round((m.y + c.dy - sobe) / nc) * nc;
      v.drawImage(coracao, hx, hy, 7 * nc, 6 * nc);
    }
  }

  // ---------- início ----------
  dividirLetras();
  medir();
  addEventListener('resize', medir);
  document.fonts && document.fonts.addEventListener('loadingdone', ajustarTexto);
  $('abrir').addEventListener('click', abrir);
  botaoMorcego.addEventListener('pointerdown', e => { e.preventDefault(); carinho(); });
  botaoMorcego.addEventListener('click', e => { if (e.detail === 0) carinho(); });
  requestAnimationFrame(t => { ult = t; xAnt = cx; quadro(t); });
})();
</script>
</body>
